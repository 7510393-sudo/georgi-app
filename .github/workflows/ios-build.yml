# Сборка в облаке. Проверяет, что приложение собирается, на каждый толчок в
# репозиторий. Аккаунт Apple для этого не нужен: сборка для симулятора не
# подписывается.
name: Сборка iOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4


      - name: Взять самый новый Xcode на машине
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Поставить XcodeGen
        run: brew install xcodegen

      - name: Собрать проект Xcode из project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Выбрать симулятор
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid']); raise SystemExit
          sys.exit('нет доступного симулятора iPhone')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Собрать приложение и прогнать проверки формата
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Chronotheca.xcodeproj \
            -scheme Chronotheca \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
