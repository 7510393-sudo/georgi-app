name: Chronotheca
options:
  bundleIdPrefix: com.kobiashvili
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chronotheca:
    type: application
    platform: iOS
    sources:
      - path: Chronotheca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobiashvili.diary
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Приложение не шифрует ничего. Без этой строки App Store Connect
        # спрашивает про шифрование у каждой сборки и держит её до ответа.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Chronotheca
        # Микрофон — только когда человек нажал «аудио» (P209).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Чтобы записать голосовую заметку в ваш дневник. Запись ложится файлом в вашу папку «Аудио»."
        # Место спрашивается только по нажатию на геоточку (P207).
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Чтобы отметить на вашей карте, где вы сейчас. Место записывается только в ваши файлы и никуда не отправляется."
        # Своя папка приложения видна в «Файлах»: «На iPhone › Chronotheca» (P223).
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Замок записей (P249).
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Чтобы закрыть ваши записи замком: без вашего лица или кода их не откроет никто."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  ChronothecaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChronothecaTests
    dependencies:
      - target: Chronotheca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobiashvili.diary.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Chronotheca:
    build:
      targets:
        Chronotheca: all
        ChronothecaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChronothecaTests
    archive:
      config: Release
