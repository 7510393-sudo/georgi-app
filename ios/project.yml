name: Chronotheca
options:
  bundleIdPrefix: com.kobiashvili
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chronotheca:
    type: application
    platform: iOS
    sources:
      - path: Chronotheca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobiashvili.diary
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chronotheca
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Chronotheca:
    build:
      targets:
        Chronotheca: all
    run:
      config: Debug
    archive:
      config: Release
